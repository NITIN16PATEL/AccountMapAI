services:
  - type: web
    name: accountmap-ai-api
    env: python
    plan: free
    region: oregon
    buildCommand: "cd backend && python -m pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DEMO_MODE
        value: "true"
      - key: AI_PROVIDER
        value: "local"
      - key: ALLOWED_HOSTS
        value: '["*"]'
      - key: CORS_ORIGINS
        value: '["https://your-frontend-domain.netlify.app","http://localhost:5173","http://127.0.0.1:5173"]'
